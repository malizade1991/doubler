# Pinned Gradle distribution for reproducibility.
#
# The repository intentionally does NOT commit the binary `gradle-wrapper.jar`
# or the `gradlew` launcher scripts. When they are absent, the Flutter tool
# injects them from its cache during the first build (see
# `flutter_tools` `injectGradleWrapperIfNeeded`), which preserves any existing
# `gradle-wrapper.properties`. Pinning the distribution here therefore makes
# the build deterministic without committing a binary.
#
# Compatibility (verified for this project):
#   * AGP 8.7.0 (android/settings.gradle) requires Gradle >= 8.9.
#   * Flutter 3.29.x validates Gradle against AGP in [8.0, 8.10.2] and uses
#     8.10.2 as its template default, so 8.10.2 is the fully-tested value.
# To upgrade: run `cd android && gradle wrapper --gradle-version X.Y.Z` once on
# a machine with Gradle, then commit the regenerated files (incl. the jar).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
