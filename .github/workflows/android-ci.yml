# DOUBLER — Android CI + Release pipeline.
#
# Triggers:
#   * pull_request          -> validate (analyze + test) + unsigned/dev-signed build
#   * push to `main`        -> validate + build (CI validation only, no publish)
#   * push of tag `v*`      -> validate + signed release build + GitHub Release
#   * workflow_dispatch     -> manual build (set `run_release` to publish from a tag)
#
# Versioning: `pubspec.yaml` is the source of truth for X.Y.Z. A `vX.Y.Z` tag must
#   agree with pubspec, or the release build fails. An optional `+N` in the tag sets
#   the build number. See docs/CI.md.
#
# Pinned third-party actions (immutable commit SHAs; tag noted for readability):
#   actions/checkout            v7.0.1   3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-java          v6.0.1   de7274f081f381c8f8158605e0321c36c376e2e6
#   actions/upload-artifact     v7.0.1   043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact   v8.0.1   3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   subosito/flutter-action     v2.23.0  1a449444c387b1966244ae4d4f8c696479add0b2
#   softprops/action-gh-release v3.0.3   efb35369e0ad2afab669f228072c1b0d510eae64
#
# Flutter SDK is pinned to 3.29.3: it is the newest stable whose bundled
# `flutter_localizations` still pins `intl: 0.19.0` (required by `intl: ^0.19.0` in
# pubspec) and whose Gradle/AGP validation matches AGP 8.7.0 / Gradle 8.10.2 here.
#
# IMPORTANT (l10n landmine): do NOT add `generate: true` to pubspec.yaml, do NOT
# run `flutter gen-l10n` in CI, and do NOT add an `l10n.yaml` at the repo root
# (its presence alone makes `flutter analyze` fail). `lib/core/l10n/app_localizations.dart`
# is hand-written; the ARB files are only source data. See docs/CI.md.

name: Android CI / Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_release:
        description: "Publish a GitHub Release (tag runs only)"
        type: boolean
        default: false

# Least-privilege default. The release job escalates to `contents: write`.
permissions:
  contents: read

# Avoid duplicate runs: group by PR number or ref; superseded PR/branch runs are
# cancelled, but a tag/release run is never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.29.3"
  # Match android/app/build.gradle (Java 17) and the ubuntu-24.04 default JDK.
  JAVA_VERSION: "17"
  # When the four ANDROID_* signing secrets are missing on a tag build:
  #   "false" (default) -> build with the debug keystore and publish the tag as an
  #                        unsigned PRE-RELEASE, labelled as such, so the tag
  #                        still produces something downloadable.
  #   "true"            -> fail the build loudly instead, as the pipeline used to.
  # See docs/CI.md → "Signing".
  REQUIRE_SIGNED_RELEASE: "false"

jobs:
  validate:
    name: Analyze + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Guard — no root l10n.yaml (breaks analyze, see docs/CI.md)
        run: |
          if [ -f l10n.yaml ]; then
            echo "::error file=l10n.yaml::A root l10n.yaml makes 'flutter analyze' attempt synthetic-package generation and fail. Keep the sample at docs/l10n.yaml.example."
            exit 1
          fi

      - name: Fetch dependencies
        run: flutter pub get

      - name: Static analysis
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee analyze.txt

      # Mirror findings into the job summary AND as inline annotations, so they are
      # readable without downloading raw logs (which need extra permissions/tooling).
      - name: Publish analyzer findings
        if: ${{ always() && steps.analyze.outcome == 'failure' }}
        run: |
          {
            echo "### \`flutter analyze --fatal-infos --fatal-warnings\` findings"
            echo
            echo '```'
            cat analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Lines look like: "  info • Message here • lib/foo.dart:12:5 • rule_name"
          sed -n 's/^[[:space:]]*\(info\|warning\|error\)[[:space:]]*•[[:space:]]*/\1•/p' analyze.txt |
          while IFS= read -r line; do
            sev="${line%%•*}"
            rest="${line#*•}"
            msg="$(printf '%s' "$rest" | awk -F' • ' '{print $1}')"
            loc="$(printf '%s' "$rest" | awk -F' • ' '{print $2}')"
            rule="$(printf '%s' "$rest" | awk -F' • ' '{print $3}')"
            file="$(printf '%s' "$loc" | cut -d: -f1)"
            ln="$(printf '%s' "$loc" | cut -d: -f2)"
            col="$(printf '%s' "$loc" | cut -d: -f3)"
            case "$sev" in
              error) lvl=error ;;
              warning) lvl=warning ;;
              *) lvl=notice ;;
            esac
            echo "::${lvl} file=${file},line=${ln:-1},col=${col:-1},title=flutter analyze (${rule:-$sev})::${msg}"
          done

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt

      - name: Publish test failures
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: |
          {
            echo "### \`flutter test\` failures"
            echo
            echo '```'
            grep -E '^(\[E\]|[[:space:]]*Expected:|[[:space:]]*Actual:|.*\[E\])|failed|Exception' test.txt | head -100 || tail -100 test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit the failure text itself as annotations (readable via the checks API).
          python3 -c "$TEST_ANNOTATE"
        env:
          TEST_ANNOTATE: |
            lines = open('test.txt', errors='replace').read().splitlines()
            # 1) name every failing test: "[E]" lines carry file + test name, and
            #    plain expect() failures print no banner, so this is the only
            #    reliable way to learn which tests broke from the checks API.
            seen = set()
            for line in lines:
                if '[E]' not in line:
                    continue
                name = line.split(':', 2)[-1].replace('[E]', '').strip().lstrip(': ')
                if name and name not in seen:
                    seen.add(name)
                    print('::error title=failing test::' + name.replace('%', '%25')[:400])
            # 2) then the exception text itself (up to the annotation cap).
            idx = [i for i, l in enumerate(lines) if 'EXCEPTION CAUGHT' in l]
            budget = max(0, 9 - len(seen))
            for i in idx[:budget]:
                block = [x.strip() for x in lines[i:i + 30] if x.strip()]
                msg = ' | '.join(block)[:1200]
                print('::error title=flutter test::' + msg.replace('%', '%25'))
            # 3) plain expect() failures have no banner: quote the few lines the
            #    reporter printed after the [E] marker instead of hiding them.
            if not idx and budget:
                for i, line in enumerate(lines):
                    if '[E]' not in line or len(idx) >= budget:
                        continue
                    block = [x.strip() for x in lines[i:i + 8] if x.strip()]
                    print('::error title=test failure detail::' + ' | '.join(block)[:900].replace('%', '%25'))

  build:
    name: Build Android artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      # 'true' only when the release keystore secrets were present (tag builds).
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version (pubspec = source of truth)
        id: ver
        run: |
          set -euo pipefail
          RAW="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          NAME="${RAW%%+*}"
          NUMBER="${RAW##*+}"
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"

          if [ "$IS_TAG" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${TAG%%+*}"
            if [ "$TAG" != "$TAG_NAME" ]; then TAG_NUMBER="${TAG##*+}"; else TAG_NUMBER="$NUMBER"; fi
            if [ "$TAG_NAME" != "$NAME" ]; then
              echo "::error::Tag v${TAG_NAME} does not match pubspec version ${NAME}. Update pubspec.yaml first."
              exit 1
            fi
            NUMBER="$TAG_NUMBER"
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${NAME}+${NUMBER} (is_tag=${IS_TAG})"

      - name: Resolve release signing on tag builds
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then echo "::warning::Secret $s is not set."; missing=1; fi
          done
          if [ "$missing" = "0" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing: configured."
            exit 0
          fi
          if [ "$REQUIRE_SIGNED_RELEASE" = "true" ]; then
            echo "::error::Release signing is not configured and REQUIRE_SIGNED_RELEASE=true. See docs/CI.md for the required secrets."
            exit 1
          fi
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Unsigned release::Release signing is not configured. Building with the debug keystore and publishing this tag as an unsigned PRE-RELEASE. Add the four ANDROID_* secrets (docs/CI.md) and re-run for a signed release."
          {
            echo "### ⚠️ Unsigned QA build"
            echo
            echo "The four \`ANDROID_*\` signing secrets are not set, so this tag is built"
            echo "with the Android **debug** keystore and published as a **pre-release**."
            echo "It installs and runs, but it cannot go to Google Play. See docs/CI.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release signing (signed tag builds only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          # Never leak keystore bytes or passwords to the log.
          chmod 600 android/app/release-keystore.jks android/key.properties

      - name: Build release APKs (split per ABI)
        id: apk
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.number }}" 2>&1 | tee build.txt

      - name: Build Android App Bundle
        id: aab
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.number }}" 2>&1 | tee -a build.txt

      # Gradle/AAPT/lint failures are otherwise only in the raw log, which needs
      # extra permissions to fetch; mirror the interesting lines as annotations so
      # `gh api .../check-runs/<id>/annotations` explains a red build.
      - name: Publish build failure
        if: ${{ always() && (steps.apk.outcome == 'failure' || steps.aab.outcome == 'failure') }}
        run: |
          [ -f build.txt ] || : > build.txt
          {
            echo "### Android build failure"
            echo
            echo '```'
            grep -E '^(FAILURE|\* What went wrong|> Task|e: |Error: |W: |.*error:|Execution failed|\[LINT\])' build.txt | head -60 || tail -60 build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            grep -E '^(FAILURE|e: |Error: |\* What went wrong|Execution failed|> Task .*FAILED)' build.txt \
              | sed -n '1,8p'
          } | while IFS= read -r line; do
            printf '::error title=android build::%s\n' "${line//%/%25}"
          done

      - name: Verify produced artifacts (fail loudly on path mismatch)
        run: |
          set -euo pipefail
          echo "--- flutter-apk/ ---"; ls -la build/app/outputs/flutter-apk/ || true
          echo "--- apk/ ---"; find build/app/outputs/apk -name '*.apk' -print || true
          echo "--- bundle/ ---"; find build/app/outputs/bundle -name '*.aab' -print || true
          apk_count="$(find build/app/outputs -name '*-release.apk' | wc -l)"
          aab_count="$(find build/app/outputs -name '*-release.aab' | wc -l)"
          echo "Found $apk_count release APK(s) and $aab_count AAB(s)."
          if [ "$apk_count" -lt 1 ] || [ "$aab_count" -lt 1 ]; then
            echo "::error::Expected at least one release APK and one AAB."
            exit 1
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
            build/app/outputs/flutter-apk/*.aab
            build/app/outputs/bundle/**/*.aab

  release:
    name: Publish GitHub Release
    # Tag pushes publish automatically. A manual run publishes only from a tag ref
    # AND only when `run_release` is set (the input was previously dead config).
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_release)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # required to create a release + attach assets
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-${{ github.run_number }}
          path: dist/

      - name: Rename assets for humans
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r apk; do
            abi="$(basename "$apk" .apk)"
            abi="${abi#app-}"
            abi="${abi%-release}"
            cp "$apk" "release-assets/doubler-${{ github.ref_name }}-${abi}.apk"
          done < <(find dist -type f -name '*.apk' | sort)
          while IFS= read -r aab; do
            cp "$aab" "release-assets/doubler-${{ github.ref_name }}.aab"
          done < <(find dist -type f -name '*.aab' | sort)
          ls -l release-assets
          test -n "$(ls -A release-assets)"

      - name: Compose release title and notes
        id: shape
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          if [ "$SIGNED" = "true" ]; then
            {
              echo "Release build of DOUBLER \`$VERSION\` (\`${{ github.sha }}\`), signed with the"
              echo "Android release keystore."
            } > release-notes.md
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=DOUBLER $VERSION" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## ⚠️ Unsigned QA build"
              echo
              echo "Release signing secrets are **not configured** for this repository, so these"
              echo "artifacts are signed with the Android **debug** keystore. They install and run"
              echo "for testing, but they cannot be uploaded to Google Play and must not be"
              echo "distributed as a production build."
              echo
              echo "Add the four \`ANDROID_*\` signing secrets ([docs/CI.md](https://github.com/${{ github.repository }}/blob/main/docs/CI.md))"
              echo "and re-run this tag to get a signed release."
            } > release-notes.md
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=DOUBLER $VERSION (unsigned QA build)" >> "$GITHUB_OUTPUT"
          fi
          {
            echo
            echo "### Install"
            echo
            echo "| Device | File |"
            echo "| --- | --- |"
            echo "| Most phones (arm64-v8a) | \`doubler-$VERSION-arm64-v8a.apk\` |"
            echo "| Older 32-bit phones | \`doubler-$VERSION-armeabi-v7a.apk\` |"
            echo "| Emulators / x86_64 | \`doubler-$VERSION-x86_64.apk\` |"
            echo "| Google Play upload | \`doubler-$VERSION.aab\` |"
            echo
            echo "DOUBLER translates YouTube — or any other app's — audio on the device, with"
            echo "your own Gemini API key. Nothing is sent to a DOUBLER server, because there"
            echo "is none."
            echo
            echo "What changed: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.shape.outputs.title }}
          draft: false
          prerelease: ${{ steps.shape.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: release-assets/*
